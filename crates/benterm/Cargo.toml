[package]
name = "benterm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
benterm_ipc.workspace = true
benterm_ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
libc = "0.2"

[dev-dependencies]
# For the agent state the panes_talk test reads.
benterm_agent.workspace = true
# For examples/screenshot.rs, which renders a terminal to an image.
benterm_core.workspace = true
benterm_terminal.workspace = true
# For the made-up tasks and records of the kanban in examples/screenshot.rs.
benterm_session.workspace = true
benterm_task.workspace = true
# For the made-up checked report of examples/screenshot.rs.
benterm_report.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# For the fake app of the socket API tests, shared with benterm_ipc.
serde_json = "1"
tempfile.workspace = true
